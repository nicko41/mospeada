<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOSPEADA · Cyclone Initializing</title>
<style>
:root{color-scheme:dark;--cyan:#70cbee;--light:#cdefff;--line:#5cadd7;--green:#49fba2;--bg:#030b13}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#c5e7f6;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 46%,#0b2535 0%,#061521 52%,#02080e 100%);overflow-x:hidden}.scan{pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 4px,#9ad5f205 4px 5px);opacity:.35}.shell{max-width:1280px;margin:0 auto;padding:28px 34px 18px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:baseline;text-transform:uppercase;letter-spacing:.24em;font-size:12px;color:#8bc5e6}.topline strong{color:#f2f6fe;letter-spacing:.2em}.brand{display:flex;justify-content:space-between;align-items:center;margin:30px 0 16px;border-bottom:1px solid #457eaa;padding:0 8px 15px}.brand-title{font-size:clamp(24px,4vw,46px);line-height:1;font-style:italic;letter-spacing:.11em;font-weight:900;color:#e5f5ff;text-shadow:0 0 22px #4cb4fb55}.brand-sub{font-size:12px;letter-spacing:.32em;color:#7ebddf;margin-top:8px}.brand-meta{text-align:right;letter-spacing:.15em;color:#97d7ed;font-size:13px}.stage{position:relative;max-width:1130px;margin:auto;aspect-ratio:1100/575}.main-svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 10px #308bb72e)}.outer{fill:#071924;stroke:#9ed8ff;stroke-width:5}.panel{fill:#06151f;stroke:#2f7096;stroke-width:2}.seam{fill:none;stroke:#3d90bc;stroke-width:2}.decor{fill:none;stroke:#4b9fc5;stroke-width:2}.seg{stroke:#a9f0ff55;stroke-width:1.3;transition:fill .14s ease,filter .14s ease,opacity .14s ease}.seg.off{fill:#132535;opacity:.95}.seg.on{opacity:1;filter:drop-shadow(0 0 7px currentColor)}.seg.dim{opacity:.5}.segment-outline{fill:none;stroke:#34779c;stroke-width:2}.svgtext{font-family:Arial,Helvetica,sans-serif;fill:#9cd9f6;letter-spacing:3px}.svgsmall{font-size:15px}.svgmed{font-size:19px;font-weight:bold}.loading{font-weight:bold;font-size:23px;letter-spacing:7px;fill:#85d8ee}.pct{font-family:monospace;font-size:120px;font-weight:700;fill:#d1fff1;letter-spacing:-8px;filter:drop-shadow(0 0 12px #37e7bd85)}.righttxt{font-family:Arial,Helvetica,sans-serif;fill:#b7e4fa;letter-spacing:1.3px}.check{fill:#65e893}.status-bg{fill:#091d2b;stroke:#5f9ec3;stroke-width:3}.status-led{fill:#142a37;stroke:#7eabc5}.status-led.active{fill:#64fd82;filter:drop-shadow(0 0 5px #55ff89)}.foot{display:flex;justify-content:space-between;gap:14px;align-items:center;color:#699eb8;letter-spacing:.16em;text-transform:uppercase;font-size:12px;border-top:1px solid #245b7c;padding-top:16px;margin-top:2px}.controls{margin:28px auto 0;padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;border:1px solid #1b4b60;background:#071620aa;border-radius:12px;max-width:780px}.controls label{font-size:12px;color:#9fc5d9;letter-spacing:.08em}.controls input[type=range]{width:220px;accent-color:#4cf6a4}.controls button{cursor:pointer;background:#102d3d;color:#d3f8fc;border:1px solid #4385a4;padding:9px 15px;border-radius:5px}.controls button:hover{background:#164761}.note{font-size:12px;color:#78aabf;text-align:center;margin:10px 0}.sr{position:absolute;left:-10000px}@media(max-width:700px){.shell{padding:16px 10px}.brand{margin:20px 0 0}.brand-meta{display:none}.topline{font-size:9px;letter-spacing:.12em}.stage{min-width:0}.foot{font-size:9px}.controls{margin-top:18px}}
</style>
</head>
<body>
<div class="scan"></div>
<main class="shell">
<div class="topline"><span><strong>MOSPEADA</strong> / Cyclone System</span><span>VR-052F · INITIALIZATION</span></div>
<header class="brand"><div><div class="brand-title">MOSPEADA <span style="color:#ff483d">/</span></div><div class="brand-sub">VR-052F · CYCLONE SYSTEM</div></div><div class="brand-meta">SYSTEM BOOT<br><span style="font-size:11px;color:#719bb6">EARTH RECOVERY MISSION</span></div></header>
<section class="stage" aria-label="Panel de carga Cyclone">
<svg class="main-svg" viewBox="0 0 1100 575" role="img" aria-labelledby="paneltitle"><title id="paneltitle">Indicador segmentado de carga de la Cyclone</title>
<defs><linearGradient id="met" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#b5e8ff"/><stop offset=".5" stop-color="#32749b"/><stop offset="1" stop-color="#d5edff"/></linearGradient><filter id="screenGlow"><feGaussianBlur stdDeviation="8"/></filter></defs>
<path class="outer" d="M80 498 L26 464 L100 350 L208 150 L284 49 L902 49 L1028 146 L1074 446 L1032 506 Z"/>
<path class="panel" d="M94 482 L57 457 L127 349 L230 169 L306 76 L888 76 L997 160 L1037 438 L1009 478 Z"/>
<path class="seam" d="M45 418 L25 418 L77 340 L158 340 M173 121 L247 18 L942 18 L987 58 M1050 336 L1081 336"/>
<!-- Actual segmented curved loading-meter in SVG -->
<g id="segments"></g>
<path class="segment-outline" d="M126 427 C155 371 180 326 203 273 C236 199 273 150 327 136 C435 128 538 133 679 136"/>
<path class="panel" d="M343 228 L778 228 L807 254 L775 414 L295 414 Z"/>
<path class="decor" d="M363 245 H754 L766 258 M316 390 H770 M359 280 H402 M707 280 H765 M318 376 h55"/>
<text x="376" y="269" class="loading">&gt;&gt;&gt; LOADING</text>
<text id="percent" x="510" y="355" class="pct" text-anchor="middle">0%</text>
<text id="activity" x="359" y="385" class="svgtext svgsmall">INITIALIZING...</text>
<path class="seam" d="M343 427 H771"/>
<text x="362" y="456" class="svgtext svgsmall">SPEED</text><text x="501" y="456" class="svgtext svgmed">000 km/h</text><text x="664" y="456" class="svgtext svgsmall">315°</text>
<path class="panel" d="M822 177 H979 L1002 206 L996 448 H806 Z"/>
<text x="847" y="210" class="righttxt" style="font-size:21px;font-weight:bold">VR-052F</text><text x="846" y="230" class="righttxt" style="font-size:12px;fill:#70b6da">CYCLONE TYPE</text>
<path class="seam" d="M835 245 H975"/>
<text x="847" y="273" class="righttxt" style="font-size:18px;font-weight:bold">SYS CHECK</text>
<g id="checks"><text x="852" y="305" class="righttxt" style="font-size:15px">■ PWR</text><text id="ok1" x="950" y="305" class="righttxt check" style="font-size:15px">...</text><text x="852" y="335" class="righttxt" style="font-size:15px">■ HUD</text><text id="ok2" x="950" y="335" class="righttxt check" style="font-size:15px">...</text><text x="852" y="365" class="righttxt" style="font-size:15px">■ DRIVE</text><text id="ok3" x="950" y="365" class="righttxt check" style="font-size:15px">...</text><text x="852" y="395" class="righttxt" style="font-size:15px">■ LINK</text><text id="ok4" x="950" y="395" class="righttxt check" style="font-size:15px">...</text></g>
<g id="leds"></g>
<text x="530" y="538" text-anchor="middle" class="svgtext" style="font-size:17px;letter-spacing:6px">INITIALIZING CYCLONE SYSTEM</text>
</svg></section>
<div class="foot"><span id="footstate">Cargando sistema Cyclone...</span><span>MISSION · MOSPEADA</span></div>
<div class="controls"><label for="slider">PROBAR PROGRESO</label><input id="slider" type="range" min="0" max="100" value="0"><strong id="sample">0%</strong><button id="demo">Simular carga</button><button id="reset">Reiniciar</button></div>
<p class="note">Demo: control manual o automático. Se integra con la carga real del juego desde JavaScript.</p>
<div id="announcer" class="sr" aria-live="polite"></div>
</main>
<script>
(function(){
const NS='http://www.w3.org/2000/svg',g=document.getElementById('segments'),leds=document.getElementById('leds');
// Individual trapezoids: a continuous curved meter transitioning from lower left to upper right.
// Each polygon follows a locally sampled curved centerline, with the long sides perpendicular to the path.
const left=[173,439], bend=[313,159], right=[693,162];
function bez(t){if(t<.47){let v=t/.47;let p0=left,p1=[260,230],p2=bend;return [(1-v)**2*p0[0]+2*(1-v)*v*p1[0]+v*v*p2[0],(1-v)**2*p0[1]+2*(1-v)*v*p1[1]+v*v*p2[1]];}let v=(t-.47)/.53,p0=bend,p1=[383,146],p2=right;return [(1-v)**2*p0[0]+2*(1-v)*v*p1[0]+v*v*p2[0],(1-v)**2*p0[1]+2*(1-v)*v*p1[1]+v*v*p2[1]];}
const total=29,segmentEls=[];
for(let i=0;i<total;i++){
 const t=(i+.5)/total,p=bez(t),a=bez(Math.max(0,t-.005)),b=bez(Math.min(1,t+.005));
 const len=Math.hypot(b[0]-a[0],b[1]-a[1]),dx=(b[0]-a[0])/len,dy=(b[1]-a[1])/len;
 const nx=-dy,ny=dx,half= i<12 ? 23 : 20;
 const w= i<12 ? 12 : 11;
 const pts=[[p[0]-dx*w/2+nx*half,p[1]-dy*w/2+ny*half],[p[0]+dx*w/2+nx*half,p[1]+dy*w/2+ny*half],[p[0]+dx*w/2-nx*half,p[1]+dy*w/2-ny*half],[p[0]-dx*w/2-nx*half,p[1]-dy*w/2-ny*half]];
 const poly=document.createElementNS(NS,'polygon');poly.setAttribute('points',pts.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' '));poly.classList.add('seg','off');g.appendChild(poly);segmentEls.push(poly);
}
for(let i=0;i<6;i++){let group=document.createElementNS(NS,'g');let r=document.createElementNS(NS,'rect');r.setAttribute('x',125+i*114);r.setAttribute('y',464);r.setAttribute('width',101);r.setAttribute('height',29);r.setAttribute('rx',3);r.setAttribute('class','status-bg');group.appendChild(r);let led=document.createElementNS(NS,'rect');led.setAttribute('x',135+i*114);led.setAttribute('y',472);led.setAttribute('width',14);led.setAttribute('height',13);led.setAttribute('rx',2);led.setAttribute('class','status-led');group.appendChild(led);let t=document.createElementNS(NS,'text');t.setAttribute('x',156+i*114);t.setAttribute('y',483);t.setAttribute('font-size',12);t.setAttribute('font-weight','bold');t.setAttribute('fill','#c9e8f6');t.textContent=['PWR','ENG','SENS','COMM','NAV','WEAP'][i];group.appendChild(t);leds.appendChild(group)}
const slider=document.getElementById('slider'),pctEl=document.getElementById('percent'),activity=document.getElementById('activity'),footstate=document.getElementById('footstate'),sample=document.getElementById('sample');let progress=0,timer=null;
function setProgress(value,message){progress=Math.min(100,Math.max(0,Number(value)||0));const count=Math.ceil(total*progress/100);for(let i=0;i<total;i++){const el=segmentEls[i],h=i/(total-1);let col=h<.45?'#42f28e':h<.68?'#b8ff37':h<.82?'#ffe347':'#fb6d35';el.style.color=col;el.style.fill=i<count?col:'#132535';el.classList.toggle('on',i<count);el.classList.toggle('off',i>=count)}pctEl.textContent=Math.round(progress)+'%';slider.value=progress;sample.textContent=Math.round(progress)+'%';let text=message||(progress>=100?'SYSTEM READY':'LOADING ASSETS...');activity.textContent=text.toUpperCase();footstate.textContent=progress>=100?'Cyclone lista para conducir':text;document.getElementById('announcer').textContent=Math.round(progress)+' por ciento';[...document.querySelectorAll('.status-led')].forEach((el,i)=>el.classList.toggle('active',progress>=((i+1)/6)*100));for(let i=1;i<=4;i++)document.getElementById('ok'+i).textContent=progress>=i*25?'OK':'...';return progress}
function stop(){if(timer){clearInterval(timer);timer=null}}
function finish(){stop();setProgress(100,'SYSTEM READY')}
function reset(){stop();setProgress(0,'INITIALIZING...')}
function demo(){reset();let start=performance.now();timer=setInterval(()=>{let d=(performance.now()-start)/4500;setProgress(Math.min(100,Math.round(100*(1-Math.pow(1-Math.min(1,d),1.3)))),d<.35?'LOADING TERRAIN':d<.7?'LOADING VEHICLES':'PREPARING SCENE');if(d>=1)finish()},50)}
slider.addEventListener('input',e=>{stop();setProgress(e.target.value)});document.getElementById('demo').addEventListener('click',demo);document.getElementById('reset').addEventListener('click',reset);
window.MospeadaPreloader={setProgress,finish,reset};reset();
})();
</script></body></html>
